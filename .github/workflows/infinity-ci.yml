name: CRAFTY INFINITY Verification

on:
  push:
    branches:
      - feature/infinity-prelaunch
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify source integrity
        run: |
          python infinity/security/verify_manifest.py infinity

      - name: Execute regression and safety audit
        run: |
          python infinity/security/audit.py
